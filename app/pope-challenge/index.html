<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The Pope Challenge: quiz a squadre sulla Dottrina sociale della Chiesa per il Gruppo Giovani di Cologno Monzese.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}</style>
</head>
<body>
<title>The Pope Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: palco a schermo intero da proiettare — barra alta, scena centrale, barra comandi in basso. Stile "mattoncini" del Gruppo Giovani. */
:root{
  --paper:#FBF9F5; --paper-2:#F3EFE7; --line:#E4E0D8; --muted:#8C8AA0; --soft:#B9B6C8;
  --ink:#1E2240; --coral:#C8644B; --coral-d:#B4553D; --sage:#3E7F78; --sage-d:#2F6660; --yellow:#E9B949; --yellow-l:#F6E3AE;
  --plum:#7D5E92; --moss:#6F8F4E;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Source Serif 4',Georgia,serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sage);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px 10px;border-bottom:1.5px solid var(--line);font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{color:var(--coral-d);white-space:nowrap}
.minis{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;background:var(--paper-2);letter-spacing:.04em;text-transform:none;font-size:13px;font-variant-numeric:tabular-nums}
.mini i{width:10px;height:10px;border-radius:3px;display:block}

/* stage */
.stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding-block:clamp(14px,3vh,36px)}
.scene{flex:1;display:flex;flex-direction:column;gap:clamp(12px,2.4vh,28px);max-width:1280px;width:100%;margin:0 auto;animation:in .45s ease both}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-family:var(--f-display);font-weight:600;font-size:clamp(12px,1.2vw,16px);letter-spacing:.14em;text-transform:uppercase;color:var(--coral-d);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:var(--ink);color:var(--paper);letter-spacing:.1em}
.hand{font-family:var(--f-hand);color:var(--sage);font-size:clamp(24px,2.6vw,40px);line-height:1.05}

/* home */
.hero{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:center}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,9vw,148px);line-height:.86;letter-spacing:-.035em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero .sub{font-size:clamp(17px,1.6vw,24px);line-height:1.4;max-width:30ch;margin-top:18px}
.manches{display:flex;flex-direction:column;gap:8px;margin-top:24px;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(12px,1.1vw,15px)}
.manches div{display:flex;gap:10px;align-items:center}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:clamp(16px,2vw,28px);display:flex;flex-direction:column;gap:14px}
.panel h3{font-family:var(--f-display);font-size:18px;font-weight:800}
.teamrow{display:flex;gap:10px;align-items:center}
.teamrow .sw{width:18px;height:28px;border-radius:5px;flex:none}
.teamrow input{flex:1;min-width:0;font:600 17px var(--f-display);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--paper-2);color:var(--coral-d)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:0;border-radius:10px;padding:12px 20px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;gap:10px;transition:transform .12s ease,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.big{font-size:clamp(17px,1.6vw,22px);padding:16px 28px}
.btn.coral{background:var(--coral)}
.btn.sage{background:var(--sage)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--paper-2)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.small{font-size:13px;color:var(--muted);font-family:var(--f-display)}

/* rules */
.bigtitle{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,96px);line-height:.92;letter-spacing:-.03em;text-wrap:balance}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px)}
.rule{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:clamp(18px,2.4vw,32px);display:flex;flex-direction:column;gap:12px}
.rule .n{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4vw,60px);line-height:1}
.rule h3{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2vw,30px)}
.rule p{font-size:clamp(17px,1.6vw,24px);line-height:1.4}
.keys{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-display);font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-display);font-weight:600;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--ink);background:#fff}

/* manche intro */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,32px)}
.intro .bigtitle{font-size:clamp(56px,10vw,170px)}
.intro .tag{font-family:var(--f-hand);font-size:clamp(28px,3.4vw,54px);color:var(--sage);line-height:1}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(13px,1.3vw,18px);padding:10px 16px;border-radius:8px}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.question{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.9vw,60px);line-height:1.06;letter-spacing:-.02em;text-wrap:balance;max-width:24ch}
.clock{flex:none;width:clamp(84px,9vw,132px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4vw,58px);font-variant-numeric:tabular-nums;position:relative}
.clock.hot{background:var(--coral);animation:pulse 1s ease infinite}
.clock.done{background:var(--soft);color:var(--ink);font-size:clamp(14px,1.4vw,18px);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1}
@keyframes pulse{50%{transform:scale(1.06)}}
.wall{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.wall i{height:clamp(10px,1.4vh,16px);border-radius:3px;background:var(--line);transition:background .3s,transform .3s}
.wall i.on{background:var(--sage)}
.wall i.on.hot{background:var(--coral)}

.answers{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,22px);min-height:0}
.ans{border-radius:16px;padding:clamp(16px,2vw,28px);display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:clamp(120px,22vh,260px);color:#fff;position:relative;transition:opacity .35s,transform .35s,filter .35s;border:0;text-align:left}
.ans .lt{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.4vw,52px);line-height:1}
.ans .txt{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.7vw,44px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.ans.a{background:var(--coral)}
.ans.b{background:var(--sage)}
.ans.c{background:var(--yellow);color:var(--ink)}
.ans svg{width:clamp(30px,3vw,46px);height:auto;flex:none}
.ans.dim{opacity:.22;filter:saturate(.3);transform:scale(.97)}
.ans.win{transform:scale(1.02);box-shadow:0 0 0 5px var(--paper),0 0 0 9px var(--ink)}
.ans .ok{position:absolute;top:14px;right:16px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:5px 10px;border-radius:6px}
.prompt{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(12px,1.1vw,15px);color:var(--muted);text-align:center}

/* reveal */
.reveal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(16px,3vw,44px);flex:1;align-items:start}
.correct{display:flex;align-items:center;gap:18px;border-radius:16px;padding:clamp(16px,2vw,28px);color:#fff}
.correct .lt{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,6vw,96px);line-height:.9}
.correct .txt{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.6vw,58px);line-height:1;letter-spacing:-.02em}
.doc{display:inline-flex;gap:10px;align-items:baseline;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(12px,1.1vw,15px);color:var(--sage-d)}
.doc b{font-family:var(--f-body);font-style:italic;font-weight:600;font-size:clamp(20px,2vw,30px);letter-spacing:0;text-transform:none;color:var(--ink)}
.expl{font-size:clamp(19px,2vw,30px);line-height:1.38;max-width:38ch}
.score-panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:clamp(14px,1.8vw,24px);display:flex;flex-direction:column;gap:10px}
.score-panel h3{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.score-panel h3 span{color:var(--coral-d)}
.tbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);text-align:left;font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.4vw,20px);transition:background .15s,border-color .15s}
.tbtn .sw{width:14px;height:24px;border-radius:4px;flex:none}
.tbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn .pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em}
.tbtn .tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--soft);display:grid;place-items:center;font-size:16px;flex:none}
.tbtn.on{border-color:var(--sage);background:#E7F0EE}
.tbtn.on .tick{background:var(--sage);border-color:var(--sage);color:#fff}
.tbtn:hover{border-color:var(--soft)}

/* case */
.case{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(16px,3vw,44px);flex:1;align-items:start}
.case h2{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,5.6vw,92px);line-height:.92;letter-spacing:-.03em;text-wrap:balance}
.case .story{font-size:clamp(20px,2.2vw,34px);line-height:1.38;max-width:34ch;margin-top:clamp(12px,2vh,24px)}
.challenge{background:var(--yellow-l);border-radius:14px;padding:clamp(16px,2vw,28px);display:flex;flex-direction:column;gap:10px}
.challenge .lbl{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-d)}
.challenge p{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2vw,32px);line-height:1.15}
.timer-col{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.links{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.6vw,58px);line-height:1.02;letter-spacing:-.02em;color:var(--sage-d);text-wrap:balance}
.concepts{display:flex;flex-wrap:wrap;gap:10px}
.concepts span{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.4vw,20px);padding:8px 14px;border-radius:8px;background:var(--paper-2);border:1.5px solid var(--line)}
.note{font-family:var(--f-hand);font-size:clamp(22px,2.2vw,34px);color:var(--coral-d);line-height:1.1}
.award{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.award .nm{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.3vw,19px);min-width:0}
.award .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award .nm i{width:12px;height:22px;border-radius:4px;flex:none}
.tog{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;font-family:var(--f-display);font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tog.on{background:var(--sage);border-color:var(--sage);color:#fff}
.tog.on.why{background:var(--coral);border-color:var(--coral)}

/* leaderboard */
.board{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);flex:1;justify-content:center}
.bar{display:grid;grid-template-columns:clamp(36px,4vw,60px) minmax(0,1fr) auto;gap:16px;align-items:center}
.bar .pos{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,44px);color:var(--muted)}
.bar .track{position:relative;height:clamp(46px,7vh,76px)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:10px;display:flex;align-items:center;padding:0 16px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2vw,30px);white-space:nowrap;overflow:hidden;min-width:fit-content;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar .val{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,44px);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.bar.first .pos{color:var(--coral)}

/* podium */
.podium{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,28px);align-items:end;max-width:960px;width:100%;margin:0 auto}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.step .who{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,38px);line-height:1;text-wrap:balance}
.step .pp{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.4vw,20px);color:var(--muted);font-variant-numeric:tabular-nums}
.step .block{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:clamp(40px,6vw,96px);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.others{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-family:var(--f-display);font-weight:600;color:var(--muted)}

/* reflection */
.reflect{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,36px);max-width:1100px}
.reflect .bigtitle span{color:var(--coral)}
.reflect p.q{font-size:clamp(24px,3vw,46px);line-height:1.3;max-width:30ch;font-style:italic}

/* bottom bar */
.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 14px;border-top:1.5px solid var(--line)}
.bottom .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ico{border:1.5px solid var(--line);background:#fff;border-radius:9px;height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:14px}
.ico:hover{background:var(--paper-2)}
.ico.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prog{flex:1;display:flex;gap:3px;max-width:520px;min-width:0}
.prog i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--soft)}
.prog i.cur{background:var(--coral)}

/* score editor drawer */
.drawer{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1.5px solid var(--line);box-shadow:0 -12px 40px rgba(30,34,64,.12);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;z-index:20;max-height:70vh;overflow:auto}
.drawer .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.drawer .it{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-family:var(--f-display);font-weight:600}
.drawer .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .it b{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.drawer .it button{border:1.5px solid var(--line);background:var(--paper);border-radius:7px;width:34px;height:30px;font-weight:800}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--yellow-l);border-radius:10px;padding:10px 12px;font-family:var(--f-display);font-weight:600}

@media (max-width:760px){
  body{overflow:auto}
  .hero,.reveal,.case,.rules{grid-template-columns:minmax(0,1fr)}
  .answers{grid-template-columns:minmax(0,1fr)}
  .ans{min-height:auto}
  .minis{display:none}
  .wall{grid-template-columns:repeat(20,minmax(0,1fr));gap:2px}
  .prog{display:none}
  .bottom .lbl{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg aria-hidden="true" width="24" height="18" viewBox="0 0 24 18"><rect x="0" y="10" width="11" height="7" rx="2" fill="#C8644B"/><rect x="13" y="10" width="11" height="7" rx="2" fill="#3E7F78"/><rect x="6" y="1" width="11" height="7" rx="2" fill="#E9B949"/></svg>
      <span>The Pope Challenge · Giovani Cologno</span>
      <span class="crumb" id="crumb"></span>
    </div>
    <div class="minis" id="minis"></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="bottom">
    <div class="grp">
      <button class="ico" id="bPrev" aria-label="Indietro">←<span class="lbl">Indietro</span></button>
      <button class="ico" id="bScores" aria-label="Correggi punteggi">±<span class="lbl">Punteggi</span></button>
    </div>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="grp">
      <button class="ico" id="bSound" aria-label="Suono">♪</button>
      <button class="ico" id="bFull" aria-label="Schermo intero">⛶</button>
      <button class="btn coral" id="bNext">Avanti →</button>
    </div>
  </footer>
</div>
<div class="drawer" id="drawer" hidden></div>

<script>
(function(){
const QUIZ=[
 {q:"Quale Papa ha posto al centro il diritto a un salario giusto durante la rivoluzione industriale?",o:["Leone XIII","Benedetto XVI","Paolo VI"],c:0,doc:"Rerum novarum",yr:"1891",e:"Leone XIII, con la Rerum novarum (1891), affronta la questione operaia e la dignità del lavoratore."},
 {q:"Chi ha formulato in modo sistematico il principio di sussidiarietà?",o:["Giovanni XXIII","Pio XI","Papa Francesco"],c:1,doc:"Quadragesimo anno",yr:"1931",e:"Pio XI, nella Quadragesimo anno (1931), afferma che le realtà superiori devono sostenere, non assorbire, quelle più vicine alle persone."},
 {q:"Chi ha collegato lo sviluppo dei popoli alla costruzione della pace?",o:["Pio XII","Giovanni Paolo II","Paolo VI"],c:2,doc:"Populorum progressio",yr:"1967",e:"Paolo VI, nella Populorum progressio, afferma che lo sviluppo è il nuovo nome della pace."},
 {q:"Quale documento del Concilio Vaticano II approfondisce il rapporto tra Chiesa e mondo contemporaneo?",o:["Gaudium et spes","Caritas in veritate","Fratelli tutti"],c:0,doc:"Gaudium et spes",yr:"1965",e:"Gaudium et spes invita la Chiesa al dialogo con la società e a leggere i segni dei tempi."},
 {q:"Chi ha messo in relazione crisi ambientale e crisi sociale attraverso l’ecologia integrale?",o:["Pio XI","Papa Francesco","Giovanni XXIII"],c:1,doc:"Laudato si’",yr:"2015",e:"Papa Francesco, nella Laudato si’, unisce la cura del creato alla difesa delle persone più vulnerabili."},
 {q:"Chi ha insistito sulla carità unita alla verità nelle scelte economiche e sociali?",o:["Leone XIII","Pio XII","Benedetto XVI"],c:2,doc:"Caritas in veritate",yr:"2009",e:"Benedetto XVI, nella Caritas in veritate, mostra che economia e sviluppo richiedono un orientamento morale."}
];
const CASES=[
 {t:"Il rider invisibile",s:"Un giovane consegna cibo per dieci ore al giorno, ma il suo reddito non gli permette di vivere autonomamente.",l:"Leone XIII o Giovanni Paolo II",k:["Dignità del lavoro","Giusta retribuzione","Centralità della persona"]},
 {t:"La città controllata",s:"Una grande piattaforma tecnologica decide quali servizi rendere disponibili in una città, senza coinvolgere cittadini e realtà locali.",l:"Pio XI",k:["Sussidiarietà","Partecipazione","Attenzione alla concentrazione del potere"]},
 {t:"Pace senza giustizia?",s:"Due Paesi firmano un accordo di pace, ma continuano a vivere in condizioni di forte disuguaglianza e discriminazione.",l:"Giovanni XXIII, Pio XII o Paolo VI",k:["Rispetto dei diritti","Giustizia","Sviluppo umano"]},
 {t:"Il prezzo della moda",s:"Un marchio vende abiti economici realizzati in territori dove le condizioni di lavoro sono molto precarie e l’ambiente è gravemente danneggiato.",l:"Papa Francesco, Benedetto XVI o Leone XIII",k:["Ecologia integrale","Sviluppo responsabile","Dignità del lavoro"]},
 {t:"Ricchi in un mondo povero",s:"L’economia di un Paese cresce, ma i benefici si concentrano in una minoranza, mentre molte famiglie restano escluse.",l:"Paolo VI, Giovanni Paolo II o Benedetto XVI",k:["Sviluppo integrale","Solidarietà","Bene comune"]}
];
const TEAM_COLORS=["#C8644B","#3E7F78","#D9A52E","#1E2240","#7D5E92","#6F8F4E"];
const DEFAULT_NAMES=["Squadra Rerum","Squadra Laudato","Squadra Gaudium","Squadra Caritas","Squadra Pacem","Squadra Fratelli"];
const QUIZ_SECS=20, CASE_SECS=90;
const LETTERS=["A","B","C"], CLS=["a","b","c"];
const SHAPES=[
 '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="10" width="36" height="20" rx="5" fill="currentColor"/></svg>',
 '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="currentColor"/></svg>',
 '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L38 36 H2 Z" fill="currentColor" stroke-linejoin="round"/></svg>'
];

// ---- steps
const STEPS=[{k:"home"},{k:"rules"},{k:"intro",m:1}];
QUIZ.forEach((_,i)=>{STEPS.push({k:"quiz",i});STEPS.push({k:"reveal",i});});
STEPS.push({k:"board",m:1},{k:"intro",m:2});
CASES.forEach((_,i)=>{STEPS.push({k:"case",i});STEPS.push({k:"caseR",i});});
STEPS.push({k:"podium"},{k:"reflect"});

// ---- state
const fresh=()=>({step:0,teams:DEFAULT_NAMES.slice(0,4).map((n,i)=>({id:"t"+i+Date.now().toString(36),name:n,color:TEAM_COLORS[i]})),quiz:{},cases:{},adj:{},sound:true});
let S=fresh();
const hot=window.claude&&window.claude.hot;
try{ if(hot&&hot.data&&hot.data.S){S=hot.data.S} else {const raw=localStorage.getItem("popeChallenge.v1"); if(raw) S=Object.assign(fresh(),JSON.parse(raw));} }catch(e){}
if(S.step>=STEPS.length) S.step=0;
function save(){try{localStorage.setItem("popeChallenge.v1",JSON.stringify(S))}catch(e){}}
try{hot&&hot.snapshot&&hot.snapshot(()=>({S}))}catch(e){}

function score(id){
  let p=0;
  for(const k in S.quiz) if((S.quiz[k]||[]).includes(id)) p+=10;
  for(const k in S.cases){const a=(S.cases[k]||{})[id]; if(a){if(a.m)p+=20; if(a.w)p+=10;}}
  p+=S.adj[id]||0; return p;
}
function ranked(){return S.teams.map(t=>({...t,p:score(t.id)})).sort((a,b)=>b.p-a.p)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- audio
let ac=null;
function beep(f,d,type,vol){ if(!S.sound) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(vol||.08,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d);}catch(e){} }
const tick=()=>beep(880,.06,"square",.03), tickHot=()=>beep(1200,.09,"square",.06);
const gong=()=>{beep(392,.7,"triangle",.12);setTimeout(()=>beep(262,.9,"triangle",.12),160)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle",.1),i*120));

// ---- timer
let T={total:0,left:0,running:false,id:null,stepKey:null};
function startTimer(sec){stopTimer();T.total=sec;T.left=sec;T.running=true;T.id=setInterval(()=>{if(!T.running)return;T.left--; if(T.left<=0){T.left=0;T.running=false;stopTimer();gong();} else if(T.left<=5) tickHot(); else tick(); paintTimer();},1000);paintTimer();}
function stopTimer(){if(T.id){clearInterval(T.id);T.id=null}}
function resumeLoop(){ if(T.id) return; T.running=true; T.id=setInterval(()=>{if(!T.running)return;T.left--; if(T.left<=0){T.left=0;T.running=false;stopTimer();gong();} else if(T.left<=5) tickHot(); else tick(); paintTimer();},1000); }
function addTime(s){T.left+=s;T.total=Math.max(T.total,T.left); if(!T.id) resumeLoop(); paintTimer();}
function paintTimer(){
  const c=document.getElementById("clock"), w=document.getElementById("wall"), pb=document.getElementById("pauseBtn");
  if(!c) return;
  const hotz=T.left>0&&T.left<=5;
  if(T.left<=0){c.className="clock done";c.innerHTML="Tempo<br>scaduto"} else {c.className="clock"+(hotz?" hot":"");c.textContent=T.left}
  if(w){const n=20,on=Math.ceil(T.left/T.total*n);w.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<on?"on":""}${hotz?" hot":""}"></i>`).join("")}
  if(pb){pb.textContent=T.left<=0?"Tempo finito":(T.running?"Pausa":"Riprendi");pb.disabled=T.left<=0}
}

// ---- render
const stage=document.getElementById("stage");
function crumb(st){
  return {home:"",rules:"· Istruzioni",intro:`· Manche ${st.m}`,quiz:`· Manche 1 · Quiz`,reveal:`· Manche 1 · Risposta`,board:"· Classifica",case:"· Manche 2 · Scenario",caseR:"· Manche 2 · Confronto",podium:"· Classifica finale",reflect:"· Conclusione"}[st.k];
}
function render(){
  const st=STEPS[S.step];
  document.getElementById("crumb").textContent=crumb(st)||"";
  document.getElementById("minis").innerHTML=st.k==="home"?"":ranked().map(t=>`<span class="mini"><i style="background:${t.color}"></i>${esc(t.name)} · <b>${t.p}</b></span>`).join("");
  document.getElementById("prog").innerHTML=STEPS.map((_,i)=>`<i class="${i<S.step?"done":i===S.step?"cur":""}"></i>`).join("");
  document.getElementById("bPrev").disabled=S.step===0;
  const nb=document.getElementById("bNext");
  nb.hidden=st.k==="home";
  nb.textContent={quiz:"Mostra risposta →",case:"Mostra collegamenti →",reflect:"Fine",board:"Manche 2 →"}[st.k]||(st.k==="reveal"&&st.i===QUIZ.length-1?"Classifica →":st.k==="caseR"&&st.i===CASES.length-1?"Classifica finale →":"Avanti →");
  document.getElementById("bSound").className="ico"+(S.sound?" on":"");
  stopTimer();
  stage.innerHTML=`<section class="scene">${VIEWS[st.k](st)}</section>`;
  if(st.k==="quiz") startTimer(QUIZ_SECS);
  if(st.k==="case") startTimer(CASE_SECS);
  if(st.k==="board") requestAnimationFrame(()=>requestAnimationFrame(growBars));
  if(st.k==="podium") fanfare();
  bindScene(st);
  save();
}
function growBars(){const max=Math.max(1,...ranked().map(t=>t.p));document.querySelectorAll(".fill").forEach(el=>{el.style.width=Math.max(12,+el.dataset.p/max*100)+"%"})}

const VIEWS={
 home:()=>`
  <div class="hero">
    <div>
      <div class="eyebrow">Gioco a squadre · Dottrina sociale della Chiesa</div>
      <h1 style="margin-top:14px">The Pope<br><em>Challenge</em></h1>
      <p class="sub">La Dottrina sociale della Chiesa incontra le sfide di oggi.</p>
      <div class="manches">
        <div><span class="chip" style="background:var(--coral);color:#fff;padding:5px 10px">Manche 1</span> Chi l’ha detto? · 6 domande</div>
        <div><span class="chip" style="background:var(--sage);color:#fff;padding:5px 10px">Manche 2</span> Il Papa nel 2026 · 5 scenari</div>
      </div>
    </div>
    <div class="panel">
      <h3>Le squadre</h3>
      <div id="teamList" style="display:flex;flex-direction:column;gap:10px">
        ${S.teams.map((t,i)=>`<div class="teamrow"><span class="sw" style="background:${t.color}"></span><input id="tn-${t.id}" data-i="${i}" value="${esc(t.name)}" maxlength="28" aria-label="Nome squadra ${i+1}"><button class="x" data-del="${i}" aria-label="Togli squadra" ${S.teams.length<=2?"disabled":""}>×</button></div>`).join("")}
      </div>
      <div class="row">
        <button class="btn ghost" id="addTeam" ${S.teams.length>=6?"disabled":""}>+ Aggiungi squadra</button>
        <span class="small">da 2 a 6 squadre</span>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button class="btn big coral" id="startGame">Inizia la sfida →</button>
        <button class="btn ghost" id="resetGame">Nuova partita</button>
      </div>
      <div id="resetConfirm"></div>
      <p class="hand">a ciascuno il suo mattone</p>
    </div>
  </div>`,
 rules:()=>`
  <div class="eyebrow">Istruzioni</div>
  <h2 class="bigtitle">Le regole in 30 secondi</h2>
  <div class="rules">
    <div class="rule"><span class="n" style="color:var(--coral)">01</span><h3>Manche 1 · Quiz a risposta multipla</h3><p>20 secondi per scegliere A, B o C. Confrontatevi in squadra, poi alzate la lettera. <b>10 punti</b> per ogni risposta esatta.</p></div>
    <div class="rule"><span class="n" style="color:var(--sage)">02</span><h3>Manche 2 · Scenari da risolvere</h3><p>Quale Papa o documento aiuta a leggere il caso? <b>20 punti</b> per un abbinamento pertinente, <b>+10</b> per una motivazione convincente.</p></div>
  </div>
  <div class="keys"><span><kbd>Spazio</kbd> / <kbd>→</kbd> avanti</span><span><kbd>←</kbd> indietro</span><span><kbd>P</kbd> pausa timer</span><span><kbd>F</kbd> schermo intero</span><span><kbd>1</kbd>–<kbd>6</kbd> segna la squadra</span></div>`,
 intro:st=>st.m===1?`
  <div class="intro">
    <div class="eyebrow">Manche 1 · 6 domande</div>
    <h2 class="bigtitle">Chi l’ha<br>detto?</h2>
    <p class="tag">dalla Rerum novarum alla Laudato si’</p>
    <div class="chips"><span class="chip" style="background:var(--ink);color:var(--paper)">20 secondi</span><span class="chip" style="background:var(--coral);color:#fff">10 punti a risposta</span></div>
  </div>`:`
  <div class="intro">
    <div class="eyebrow">Cambio di sfida · 5 scenari</div>
    <h2 class="bigtitle">Il Papa<br>nel 2026</h2>
    <p class="tag">I problemi cambiano. I principi restano vivi.</p>
    <div class="chips"><span class="chip" style="background:var(--sage);color:#fff">20 punti · abbinamento</span><span class="chip" style="background:var(--coral);color:#fff">10 punti · motivazione</span></div>
  </div>`,
 quiz:st=>{const Q=QUIZ[st.i];return`
  <div class="qhead">
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="eyebrow"><span class="pill">Domanda ${st.i+1} / ${QUIZ.length}</span><span>10 punti</span></div>
      <h2 class="question">${esc(Q.q)}</h2>
    </div>
    <div class="timer-col" style="align-items:center"><div class="clock" id="clock">${QUIZ_SECS}</div></div>
  </div>
  <div class="wall" id="wall"></div>
  <div class="answers">${Q.o.map((o,j)=>`<div class="ans ${CLS[j]}"><div class="lt">${SHAPES[j]}${LETTERS[j]}</div><div class="txt">${esc(o)}</div></div>`).join("")}</div>
  <div class="row" style="justify-content:space-between">
    <span class="prompt">Confrontatevi in squadra · poi alzate A / B / C</span>
    <div class="row"><button class="btn ghost" id="pauseBtn">Pausa</button><button class="btn ghost" id="plus10">+10 s</button></div>
  </div>`},
 reveal:st=>{const Q=QUIZ[st.i],got=S.quiz[st.i]||[];return`
  <div class="eyebrow"><span class="pill">Risposta ${st.i+1} / ${QUIZ.length}</span><span>La risposta corretta è…</span></div>
  <div class="answers" style="flex:0 0 auto">${Q.o.map((o,j)=>`<div class="ans ${CLS[j]} ${j===Q.c?"win":"dim"}" style="min-height:clamp(90px,14vh,150px)">${j===Q.c?'<span class="ok">Esatta</span>':""}<div class="lt">${SHAPES[j]}${LETTERS[j]}</div><div class="txt">${esc(o)}</div></div>`).join("")}</div>
  <div class="reveal">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="doc">Documento <b>${esc(Q.doc)}</b> · ${Q.yr}</div>
      <p class="expl">${esc(Q.e)}</p>
    </div>
    <div class="score-panel">
      <h3>Chi ha indovinato? <span>+10</span></h3>
      ${S.teams.map((t,n)=>`<button class="tbtn ${got.includes(t.id)?"on":""}" data-team="${t.id}" aria-pressed="${got.includes(t.id)}"><span class="sw" style="background:${t.color}"></span><span class="nm">${n+1}. ${esc(t.name)}</span><span class="pts">${score(t.id)} pt</span><span class="tick">${got.includes(t.id)?"✓":""}</span></button>`).join("")}
    </div>
  </div>`},
 board:()=>{const r=ranked();return`
  <div class="eyebrow">Fine Manche 1</div>
  <h2 class="bigtitle" style="font-size:clamp(36px,5vw,80px)">Classifica parziale</h2>
  <div class="board">${r.map((t,i)=>`<div class="bar ${i===0&&t.p>0?"first":""}"><span class="pos">${i+1}</span><div class="track"><div class="fill" data-p="${t.p}" style="width:12%;background:${t.color}">${esc(t.name)}</div></div><span class="val">${t.p}</span></div>`).join("")}</div>`},
 case:st=>{const C=CASES[st.i];return`
  <div class="eyebrow"><span class="pill">Caso ${st.i+1} / ${CASES.length}</span><span>Scenario</span></div>
  <div class="case">
    <div><h2>${esc(C.t)}</h2><p class="story">${esc(C.s)}</p></div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="challenge"><span class="lbl">La sfida</span><p>Quale Papa o documento aiuta a leggere questa situazione? E perché?</p></div>
      <div class="row" style="gap:16px;align-items:center"><div class="clock" id="clock">${CASE_SECS}</div>
        <div style="display:flex;flex-direction:column;gap:8px"><button class="btn ghost" id="pauseBtn">Pausa</button><button class="btn ghost" id="plus10">+30 s</button></div></div>
    </div>
  </div>
  <div class="wall" id="wall"></div>`},
 caseR:st=>{const C=CASES[st.i],aw=S.cases[st.i]||{};return`
  <div class="eyebrow"><span class="pill">Caso ${st.i+1} / ${CASES.length}</span><span>Possibili collegamenti</span></div>
  <div class="case">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="small" style="letter-spacing:.12em;text-transform:uppercase;font-weight:600">${esc(C.t)}</div>
      <p class="links">${esc(C.l)}</p>
      <div class="concepts">${C.k.map(k=>`<span>${esc(k)}</span>`).join("")}</div>
      <p class="note">sono possibili anche altre risposte, se ben motivate</p>
    </div>
    <div class="score-panel">
      <h3>Punti del caso</h3>
      ${S.teams.map(t=>{const a=aw[t.id]||{};return`<div class="award"><span class="nm"><i style="background:${t.color}"></i><span>${esc(t.name)}</span></span><button class="tog ${a.m?"on":""}" data-aw="m" data-team="${t.id}" aria-pressed="${!!a.m}">Abbinamento +20</button><button class="tog why ${a.w?"on":""}" data-aw="w" data-team="${t.id}" aria-pressed="${!!a.w}">Motivazione +10</button></div>`}).join("")}
      <div class="small">Totali: ${ranked().map(t=>esc(t.name)+" "+t.p).join(" · ")}</div>
    </div>
  </div>`},
 podium:()=>{const r=ranked();const order=[r[1],r[0],r[2]];const h=[62,88,44];return`
  <div class="eyebrow">Classifica finale</div>
  <h2 class="bigtitle" style="font-size:clamp(36px,5vw,80px)">${r[0]?esc(r[0].name):""} vince la sfida!</h2>
  <div class="podium">${order.map((t,i)=>t?`<div class="step"><span class="who">${esc(t.name)}</span><span class="pp">${t.p} punti</span><div class="block" style="height:${h[i]*0.32}vh;min-height:${h[i]*1.4}px;background:${t.color};animation-delay:${[.3,.7,0][i]}s">${[2,1,3][i]}</div></div>`:"<div></div>").join("")}</div>
  ${r.length>3?`<div class="others">${r.slice(3).map((t,i)=>`<span>${i+4}. ${esc(t.name)} · ${t.p}</span>`).join("")}</div>`:""}`},
 reflect:()=>`
  <div class="reflect">
    <div class="eyebrow">Conclusione</div>
    <h2 class="bigtitle">Il quiz finisce.<br><span>Le domande restano.</span></h2>
    <p class="q">Quale ingiustizia del nostro tempo rischiamo di vedere senza fare abbastanza per cambiarla?</p>
    <p class="hand">un minuto di riflessione · poi confronto</p>
  </div>`
};

function bindScene(st){
  const $=id=>document.getElementById(id);
  if(st.k==="home"){
    document.querySelectorAll("#teamList input").forEach(inp=>inp.addEventListener("input",e=>{S.teams[+inp.dataset.i].name=inp.value||("Squadra "+(+inp.dataset.i+1));save()}));
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.teams.splice(+b.dataset.del,1);render()});
    $("addTeam").onclick=()=>{const used=S.teams.map(t=>t.color);const col=TEAM_COLORS.find(c=>!used.includes(c));const nm=DEFAULT_NAMES.find(n=>!S.teams.some(t=>t.name===n))||"Nuova squadra";S.teams.push({id:"t"+Math.random().toString(36).slice(2,8),name:nm,color:col});render()};
    $("startGame").onclick=()=>{beep(660,.12,"triangle",.08);go(1)};
    $("resetGame").onclick=()=>{$("resetConfirm").innerHTML=`<div class="confirm">Azzerare tutti i punteggi? <button class="btn coral" id="yesReset">Sì, azzera</button><button class="btn ghost" id="noReset">Annulla</button></div>`;$("yesReset").onclick=()=>{const keep=S.teams;S=fresh();S.teams=keep;render()};$("noReset").onclick=()=>{$("resetConfirm").innerHTML=""}};
  }
  if($("pauseBtn")){ $("pauseBtn").onclick=()=>{ if(T.left<=0) return; if(T.id){T.running=!T.running} else resumeLoop(); paintTimer(); }; }
  if($("plus10")) $("plus10").onclick=()=>addTime(st.k==="case"?30:10);
  if(st.k==="reveal") document.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>toggleQuiz(st.i,b.dataset.team));
  if(st.k==="caseR") document.querySelectorAll(".tog").forEach(b=>b.onclick=()=>toggleCase(st.i,b.dataset.team,b.dataset.aw));
}
function toggleQuiz(i,id){const a=S.quiz[i]=S.quiz[i]||[];const k=a.indexOf(id);if(k>=0)a.splice(k,1);else{a.push(id);beep(988,.12,"triangle",.07)}render()}
function toggleCase(i,id,f){const c=S.cases[i]=S.cases[i]||{};const a=c[id]=c[id]||{};a[f]=!a[f];if(a[f])beep(f==="m"?784:988,.12,"triangle",.07);render()}

function go(d){const n=S.step+d;if(n<0||n>=STEPS.length)return;S.step=n;closeDrawer();render();stage.scrollTop=0}
document.getElementById("bNext").onclick=()=>{if(S.step===STEPS.length-1){S.step=0;render();return}go(1)};
document.getElementById("bPrev").onclick=()=>go(-1);
document.getElementById("bSound").onclick=()=>{S.sound=!S.sound;render()};
document.getElementById("bFull").onclick=toggleFull;
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}

// score drawer
const drawer=document.getElementById("drawer");
function openDrawer(){drawer.hidden=false;paintDrawer()}
function closeDrawer(){drawer.hidden=true}
function paintDrawer(){drawer.innerHTML=`<div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:18px">Correggi punteggi</b><button class="btn ghost" id="dClose">Chiudi</button></div>
 <div class="list">${S.teams.map(t=>`<div class="it"><i style="width:12px;height:22px;border-radius:4px;background:${t.color}"></i><span class="nm">${esc(t.name)}</span><button data-adj="-5" data-team="${t.id}" aria-label="Togli 5">−5</button><b>${score(t.id)}</b><button data-adj="5" data-team="${t.id}" aria-label="Aggiungi 5">+5</button></div>`).join("")}</div>
 <span class="small">Bonus e penalità manuali, a parte i punti segnati nelle domande.</span>`;
 document.getElementById("dClose").onclick=closeDrawer;
 drawer.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{S.adj[b.dataset.team]=(S.adj[b.dataset.team]||0)+(+b.dataset.adj);save();paintDrawer();const st=STEPS[S.step];document.getElementById("minis").innerHTML=ranked().map(t=>`<span class="mini"><i style="background:${t.color}"></i>${esc(t.name)} · <b>${t.p}</b></span>`).join("")});
}
document.getElementById("bScores").onclick=()=>drawer.hidden?openDrawer():closeDrawer();

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const st=STEPS[S.step];
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault(); if(st.k!=="home") go(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1)}
  else if(e.key==="f"||e.key==="F") toggleFull();
  else if(e.key==="p"||e.key==="P"){const b=document.getElementById("pauseBtn"); b&&b.click()}
  else if(/^[1-6]$/.test(e.key)){const t=S.teams[+e.key-1]; if(!t) return; if(st.k==="reveal") toggleQuiz(st.i,t.id); if(st.k==="caseR") toggleCase(st.i,t.id,"m");}
  else if(e.key==="Escape") closeDrawer();
});
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
render();
})();
</script>

</body>
</html>

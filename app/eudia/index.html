<style>
/* Sibling brand of Komos: same charcoal bars, light grey ground and white cards; accent moves from Komos orange to clear-sky blue. */
:root{
 --bar:#2b2b2b;--bar-ink:#f2f2f2;--bar-mute:#a9a9a9;
 --bg:#f4f4f4;--card:#ffffff;--ink:#222222;--mute:#666666;--line:#e6e6e6;--soft:#eeeeee;
 --acc:#0277bd;--acc-hi:#4fc3f7;--acc-ink:#ffffff;--accs:#e3f3fc;
 --ok:#1e8449;--warn:#c27c0e;--bad:#c0392b;--yel:#c9a000;--rain:#5c6bc0;
 --shadow:0 1px 3px rgba(0,0,0,.1);
}
@media (prefers-color-scheme:dark){:root{--bar:#151515;--bar-ink:#f2f2f2;--bar-mute:#9a9a9a;--bg:#1d1d1d;--card:#282828;--ink:#ececec;--mute:#a3a3a3;--line:#3a3a3a;--soft:#333333;--acc:#4fc3f7;--acc-hi:#4fc3f7;--acc-ink:#0b2533;--accs:#16303e;--ok:#4cc27a;--warn:#e3a33b;--bad:#ef6b5c;--yel:#e8c547;--rain:#8c9eff;--shadow:0 1px 3px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,.day,.tabbar button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
h1{margin:0}h2{font-size:16px;margin:0 0 10px;font-weight:700}h3{font-size:14px;margin:16px 0 8px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,button{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid #cccccc;border-radius:4px;padding:7px 10px}
@media (prefers-color-scheme:dark){input,select{border-color:var(--line)}}
button{cursor:pointer;border:none;background:var(--soft);color:var(--ink)}
button.pri{background:var(--acc);color:var(--acc-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button[disabled]{opacity:.55;cursor:default}

/* header: charcoal brand bar + light search bar, as in Komos */
header{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
.bar-dark{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;
 padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:0 0 auto}
#title{font-size:1.5em;font-weight:800;letter-spacing:.02em;color:var(--acc-hi);line-height:1}
.tag{color:var(--bar-mute);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-dark .sp{flex:1}
.bar-dark select,.bar-dark button{background:transparent;color:var(--bar-ink);border:1px solid #4a4a4a;padding:6px 8px;font-size:14px}
.bar-dark select option{color:#222}
.bar-dark button:hover,.bar-dark select:hover{background:rgba(255,255,255,.08)}
.bar-light{background:var(--card);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
#q{flex:1;min-width:120px}
.res{border:1px solid var(--line);border-radius:6px;margin:8px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.15);overflow:hidden}
.res div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.res div:last-child{border-bottom:none}.res div:hover{background:var(--accs)}

main{max-width:1000px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.loc{font-weight:800;font-size:18px}
.card{background:var(--card);border-radius:6px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.small{font-size:12px;color:var(--mute)}
.hide{display:none}

/* day strip: like Komos item buttons, orange border when selected */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{min-width:112px;background:var(--card);border:2px solid var(--soft);border-radius:6px;padding:10px 8px;cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.day:hover{border-color:var(--acc)}
.day.on{border-color:var(--acc);background:var(--accs)}
.day .d{font-size:12px;color:var(--mute);font-weight:600;text-transform:capitalize}
.day .ic{font-size:30px;line-height:1.25}
.t{font-weight:800;font-size:17px}.tmin{color:var(--mute);font-weight:600}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.02em}
.b-high{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-medium{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-low{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:middle}
.l1{background:var(--yel)}.l2{background:var(--warn)}.l3{background:var(--bad)}

.daytitle{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.daytitle h2{margin:0;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-variant-numeric:tabular-nums}
.kpi .v{font-size:22px;font-weight:800}.kpi .s{font-size:12px;color:var(--mute)}
.kpi .lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:12px;color:var(--mute);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto}
.out{color:var(--bad);font-weight:800}
.risk{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:none}
.lv1{color:var(--yel);font-weight:700}.lv2{color:var(--warn);font-weight:700}.lv3{color:var(--bad);font-weight:700}
.chartbox{position:relative;height:240px}
.err{color:var(--bad);font-weight:700}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
ol li{margin-bottom:6px}
a{color:var(--acc)}
.banner{background:var(--bad);color:#fff;text-align:center;font-weight:700;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* bottom tab bar: charcoal like the top bar, orange active tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bar);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar button{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--bar-mute);padding:6px 0;border-radius:6px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--acc-hi);font-weight:700}
@media (max-width:480px){.tbl{font-size:12px}.tbl th,.tbl td{padding:6px 3px}.tbl th{white-space:normal}.tag{display:none}}
</style>
</head>
<body>
<header>
  <div class="bar-dark">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M6 14 C26 14 30 32 52 32" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/><path d="M6 32 L52 32" fill="none" stroke="#a9a9a9" stroke-width="5" stroke-linecap="round"/><path d="M6 50 C26 50 30 32 52 32" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/><circle cx="53" cy="32" r="9" fill="#4fc3f7"/></svg><div><h1 id="title">Eudia</h1><div class="tag" id="tagline"></div></div></div>

    <select id="lang" aria-label="Language">
      <option value="it">IT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option>
    </select>
  </div>
  <div class="bar-light row">
    <input id="q" type="search" autocomplete="off">
    <button id="btnSearch" class="pri"></button>
    <button id="btnGeo" aria-label="GPS">📍</button>
    <select id="days"></select>
  </div>
  <div id="results" class="res hide"></div>
</header>
<main>
  <div class="row" style="justify-content:space-between"><div class="loc" id="locName"></div><div id="status" class="small"></div></div>
  <div id="banner"></div>
  <section id="view"></section>
  <p class="small" id="attrib"></p>
</main>

    sm.forEach(s=>used.add(s.d));if(sm.length<8)continue;
    cal.params[k][L]=fitAll(k,sm);
    const cut=Math.floor(sm.length*2/3);if(cut>=6&&sm.length-cut>=3)cal.evalr[k][L]=evaluate(k,fitAll(k,sm.slice(0,cut)),sm.slice(cut));
   }}
  cal.nDates=used.size;
  if(!Object.values(cal.params).some(o=>Object.keys(o).length))throw new Error('no past forecasts available');
  cal.summary={};for(const k in cal.evalr){const Ls=Object.values(cal.evalr[k]).filter(Boolean);if(!Ls.length)continue;cal.summary[k]={};['mean','best','inv','sup','bma'].forEach(m=>{const x=Ls.map(o=>o[m]).filter(v=>v!=null);cal.summary[k][m]=x.length?mean(x):null})}
  S.cal=cal;store.set(key,cal);return true;
 }catch(e){S.calError=e.message;return false}finally{S.calBusy=false}
}
function methodFor(k){if(S.method!=='auto')return S.method;const r=S.cal?.summary?.[k];if(!r)return'inv';return['inv','sup','bma'].filter(m=>r[m]!=null).sort((a,b)=>r[a]-r[b])[0]||'inv'}

async function load(){

 if(!on.length){$('#view').innerHTML=`<div class="card err">${t('noModels')}</div>`;return}
 $('#status').innerHTML=`<span class="spin">⟳</span> ${t('loading')}`;S.offlineHit=false;

 const detUrl='https://api.open-meteo.com/v1/forecast?'+qs({...base,daily:Object.values(DAILY).join(','),hourly:HOURLY.join(','),models:on.map(m=>m.id).join(','),wind_speed_unit:'kmh'});
 const ensUrls=ENS.map(e=>'https://ensemble-api.open-meteo.com/v1/ensemble?'+qs({...base,hourly:ENS_H.join(','),models:e.id,wind_speed_unit:'kmh'}));
 try{
  const res=await Promise.allSettled([getJSON(detUrl),...ensUrls.map(getJSON)]);
  if(res[0].status!=='fulfilled')throw res[0].reason;
  const ens=res.slice(1).map((r,i)=>r.status==='fulfilled'?{sys:ENS[i],json:r.value}:null).filter(Boolean);
  S.cal=store.get(calKey(),null);S.raw={det:res[0].value,on,ens};
  S.data=build(res[0].value,on,ens);
  S.sel=Math.min(S.sel,S.data.days.length-1);
  S.offline=S.offlineHit;S.updated=new Date();
  $('#status').textContent=`${on.length} ${t('models')} · ${S.data.ensCount} ${t('members')} · ${t('updated')} ${S.updated.toLocaleTimeString(S.lang,{hour:'2-digit',minute:'2-digit'})}`;
  render();notifyIfNeeded();
  if(S.method!=='prior'&&(!S.cal||Date.now()-S.cal.ts>20*3600e3))calibrate(false).then(ok=>{if(ok)rebuild();else if(S.tab==='models')render()});
 }catch(e){$('#status').textContent='';$('#view').innerHTML=`<div class="card err">${t('error')}: ${esc(e.message)}</div>`}
}

function build(det,on,ens){
 const single=on.length===1;
 const pickD=(v,m)=>single?det.daily[v]:det.daily[`${v}_${m.id}`];
 const pickH=(v,m)=>single?det.hourly[v]:det.hourly[`${v}_${m.id}`];
 const hIdx=groupByDay(det.hourly.time);
 // ensemble: per system, per day, per member aggregates + hourly pooled by timestamp
 const ensTimeT=new Map(),ensTimeP=new Map();let ensCount=0;
 const ensDays=ens.map(({sys,json})=>{
  const h=json.hourly,g=groupByDay(h.time),mem={};
  ENS_H.forEach(v=>mem[v]=membersOf(h,v));
  ensCount+=mem.temperature_2m.length;
  h.time.forEach((tm,i)=>{
   const a=mem.temperature_2m.map(x=>x[i]).filter(v=>v!=null);const p=mem.precipitation.map(x=>x[i]).filter(v=>v!=null);
   if(a.length){if(!ensTimeT.has(tm))ensTimeT.set(tm,[]);ensTimeT.get(tm).push(...a)}
   if(p.length){if(!ensTimeP.has(tm))ensTimeP.set(tm,[]);ensTimeP.get(tm).push(...p)}
  });
  const out={};
  for(const [d,idx] of g){
   const o={tmax:[],tmin:[],precip:[],gust:[],snow:[]};
   mem.temperature_2m.forEach(a=>{const T=vals(a,idx);if(T.length>=20){o.tmax.push(Math.max(...T));o.tmin.push(Math.min(...T))}});
   mem.precipitation.forEach(a=>{const P=vals(a,idx);if(P.length>=20)o.precip.push(sum(P))});
   mem.wind_gusts_10m.forEach(a=>{const G=vals(a,idx);if(G.length>=20)o.gust.push(Math.max(...G))});
   mem.snowfall.forEach(a=>{const X=vals(a,idx);if(X.length>=20)o.snow.push(sum(X))});
   out[d]=o;
  }
  return{sys,days:out};
 });
 const days=det.daily.time.map((date,i)=>{
  const wf=m=>modelW(m)*(m.hires&&i<=2?1.25:1);
  const D={};
  for(const k in DAILY)D[k]=on.map(m=>({m,v:(pickD(DAILY[k],m)||[])[i],w:wf(m)})).filter(x=>x.v!=null&&!Number.isNaN(x.v));
  const idx=hIdx.get(date)||[];
  D.cape=on.map(m=>{const v=vals(pickH('cape',m),idx);return v.length?{m,v:Math.max(...v),w:wf(m)}:null}).filter(Boolean);
  const E={};['tmax','tmin','precip','gust','snow'].forEach(k=>E[k]=ensDays.map(e=>e.days[date]?.[k]||[]).filter(a=>a.length));
  const C={},ES={},AG={};
  ['tmax','tmin','precip','gust','snow','wind'].forEach(k=>{C[k]=wstats(D[k]);ES[k]=E[k]?estats(E[k]):null;AG[k]=agreement(k,C[k])});
  const L=leadFor(i);let calW=null,hw=null;
  if(S.cal&&S.method!=='prior'){
   ['tmax','tmin','precip','gust'].forEach(k=>{const p=S.cal.params[k]?.[L];if(!p||!C[k])return;const f={};D[k].forEach(x=>f[x.m.id]=x.v);const r=predict(p,f,methodFor(k));if(!r)return;
    C[k]={...C[k],raw:C[k].mean,mean:k==='tmax'||k==='tmin'?r.mean:Math.max(0,r.mean),cal:r.used,psd:r.psd,comps:r.comps,sigma:r.sigma};if(k==='tmax')calW=r.w});
   const pt=S.cal.params.tmax?.[L],pn=S.cal.params.tmin?.[L];
   if(pt){const w=methodFor('tmax')==='bma'&&pt.bma?pt.bma.w:pt.inv;hw={};for(const id in pt.st)hw[id]={w:w[id]||0,b:(pt.st[id].bias+(pn?.st[id]?.bias??pt.st[id].bias))/2}}
  }
  const ag=['tmax','tmin','precip','gust'].map(k=>AG[k]).filter(x=>x!=null);
  const modelAgr=ag.length?sum(ag)/ag.length:null;
  const ea=['tmax','tmin','precip','gust'].map(k=>ensAgreement(k,ES[k],C[k]?.mean)).filter(x=>x!=null);
  const ensAgr=ea.length?sum(ea)/ea.length:null;
  const conf=modelAgr==null?ensAgr:ensAgr==null?modelAgr:.6*modelAgr+.4*ensAgr;
  // weather code vote
  const votes={};D.code.forEach(x=>{const g=codeGroup(x.v);votes[g]=(votes[g]||0)+x.w});
  const group=Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0]||null;
  const detP=(k,op,thr)=>{const c=C[k];if(c?.comps){const up=sum(c.comps.map(q=>q.w*(1-ncdf((thr-q.mu)/c.sigma))));return op==='>='?up:1-up}return detFrac(D[k]||[],v=>cmp(op,v,thr))};
  const prob=(k,op,thr)=>combine(ensFrac(E[k]||[],v=>cmp(op,v,thr)),detP(k,op,thr));
  const pRain=prob('precip','>=',1);
  const stormCode=detFrac(D.code,v=>v>=95),stormCape=detFrac(D.cape,v=>v>=1500);
  const risks=[
   ['riskHeat',prob('tmax','>=',35)],['riskFrost',prob('tmin','<=',0)],['riskRain',prob('precip','>=',30)],
   ['riskGust',prob('gust','>=',60)],['riskSnow',prob('snow','>=',2)],
   ['riskStorm',Math.max(stormCode??0,(stormCape??0)*.7)]
  ].map(([k,p])=>({k,p:p??0,lvl:p>=.7?3:p>=.4?2:p>=.2?1:0})).filter(r=>r.lvl>0);
  return{date,i,L,D,E,C,ES,AG,modelAgr,ensAgr,conf,group,pRain,prob,risks,idx,calW,hw};
 });
 return{days,on,pickH,hourly:det.hourly,ensTimeT,ensTimeP,ensCount,ensSystems:ens.map(e=>e.sys.name)};
}

 const rows=MODELS.map(m=>`<tr><td><label><input type="checkbox" data-mon="${m.id}" ${modelOn(m)?'checked':''}> ${esc(m.name)}</label></td><td>${esc(m.org)}</td><td>${esc(m.res)}</td>
  <td><input type="number" step="0.05" min="0" max="3" value="${modelW(m)}" data-mw="${m.id}" style="width:70px"></td></tr>`).join('');
 $('#view').innerHTML=calCard()+`<div class="card"><p class="small">${t('modelHint')}</p><div class="scroll"><table class="tbl"><tr><th>${t('model')}</th><th>${t('org')}</th><th>${t('resolution')}</th><th>${t('weight')}</th></tr>${rows}</table></div>
 <h3>${t('ensSystems')}</h3><p class="small">${ENS.map(e=>e.name).join(' · ')}</p>
 <div class="row"><button class="pri" id="applyModels">${t('apply')}</button><button id="resetModels">${t('reset')}</button></div></div>`;
}
const RVARS=['tmax','tmin','precip','gust','snow'];
function evalRules(){
 if(!S.data)return[];const out=[];
 S.data.days.forEach(d=>S.rules.forEach(r=>{const p=d.prob(r.v,r.op,+r.thr);if(p!=null&&p*100>=+r.minP)out.push({date:d.date,i:d.i,rule:r,p})}));return out}
function ruleText(r){return r.name||`${t(r.v)} ${r.op==='>='?'≥':'≤'} ${r.thr}${UNIT[r.v]}`}
function renderAlerts(){
 const trig=evalRules();
 const list=S.rules.length?S.rules.map((r,i)=>`<div class="risk"><span>${esc(ruleText(r))} · ${t('prob')} ≥ ${r.minP}%</span><button data-del="${i}">${t('del')}</button></div>`).join(''):`<div class="small">${t('noRules')}</div>`;
 const tl=trig.length?trig.map(x=>`<div class="risk"><span>${esc(dayLabel(x.date,x.i))} · ${esc(ruleText(x.rule))}</span><b>${Math.round(x.p*100)}%</b></div>`).join(''):`<div class="small">${t('noneTriggered')}</div>`;
 const allRisks=S.data?S.data.days.flatMap(d=>d.risks.map(r=>`<div class="risk"><span>${esc(dayLabel(d.date,d.i))} · ${t(r.k)}</span><span class="lv${r.lvl}">${t('lvl'+r.lvl)} · ${Math.round(r.p*100)}%</span></div>`)).join(''):'';
 const notif=('Notification' in window)?(Notification.permission==='granted'?`<span class="small">✅ ${t('notifOn')}</span>`:`<button id="notifBtn">${t('enableNotif')}</button>`):'';
 $('#view').innerHTML=`<div class="card"><h2>${t('triggered')}</h2>${tl}</div>
 <div class="card"><h2>${t('risks')}</h2>${allRisks||`<div class="small">${t('noRisks')}</div>`}
  <p class="small"><a href="https://meteoalarm.org" target="_blank" rel="noopener">${t('officialWarnings')}</a></p></div>
 <div class="card"><h2>${t('myAlerts')}</h2>${list}
 <h3>${t('addRule')}</h3><div class="row">
  <label class="f">${t('variable')}<select id="rV">${RVARS.map(v=>`<option value="${v}">${t(v)}</option>`).join('')}</select></label>
  <label class="f">${t('condition')}<select id="rOp"><option value=">=">≥</option><option value="<=">≤</option></select></label>
  <label class="f">${t('threshold')}<input id="rThr" type="number" value="30" style="width:80px"></label>
  <label class="f">${t('minProb')}<input id="rP" type="number" value="50" min="1" max="100" style="width:80px"></label>
  <label class="f">${t('ruleName')}<input id="rN" type="text"></label>
  <button class="pri" id="addRule" style="align-self:flex-end">${t('addRule')}</button></div>
 <div style="margin-top:10px">${notif}</div></div>`;
}
function renderMethod(){
 $('#view').innerHTML=`<div class="card"><h2>${t('methodTitle')}</h2>${['m1','m2','m3','m4','m6','m5'].map(k=>`<p>${t(k)}</p>`).join('')}</div>
 <div class="card"><h2>${t('refs')}</h2><ol class="small">
 <li>Krishnamurti T.N. et al. (1999), Improved weather and seasonal climate forecasts from multimodel superensemble, <i>Science</i> 285.</li>
 <li>Krishnamurti T.N. et al. (2000), Multimodel ensemble forecasts for weather and seasonal climate, <i>Journal of Climate</i> 13.</li>
 <li>Hagedorn R., Doblas-Reyes F.J., Palmer T.N. (2005), The rationale behind the success of multi-model ensembles in seasonal forecasting, <i>Tellus A</i> 57.</li>
 <li>Gneiting T., Raftery A.E. (2005), Weather forecasting with ensemble methods, <i>Science</i> 310.</li>
 <li>Raftery A.E. et al. (2005), Using Bayesian Model Averaging to calibrate forecast ensembles, <i>Monthly Weather Review</i> 133.</li>
 <li>Krishnamurti T.N. et al. (2003), Improved skill for the anomaly correlation of geopotential heights at 500 hPa, <i>Monthly Weather Review</i> 131.</li>
 <li>Bougeault P. et al. (2010), The THORPEX Interactive Grand Global Ensemble (TIGGE), <i>BAMS</i> 91.</li>
 </ol></div>`;
}

/* ---------- notifications ---------- */
function notifyIfNeeded(){
 try{if(!('Notification' in window)||Notification.permission!=='granted')return;
  const trig=evalRules(),key=S.loc.lat+','+S.loc.lon+':'+trig.map(x=>x.date+x.rule.id).join('|');
  if(trig.length&&store.get('mc_lastnotif','')!==key){store.set('mc_lastnotif',key);
   const title='Eudia · '+S.loc.name,opts={body:trig.slice(0,3).map(x=>dayLabel(x.date,x.i)+': '+ruleText(x.rule)+' ('+Math.round(x.p*100)+'%)').join('\n'),icon:'icons/icon-192.png'};
   // iPhone (app on Home Screen) only shows notifications through the service worker
   if(navigator.serviceWorker?.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts));else new Notification(title,opts)}
 }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-tab],[data-day],[data-del],#btnSearch,#btnGeo,#btnRefresh,#calRun,#applyModels,#resetModels,#addRule,#notifBtn,[data-res]');if(!el)return;
 if(el.dataset.tab){S.tab=el.dataset.tab;render();window.scrollTo(0,0)}
 else if(el.dataset.day){S.sel=+el.dataset.day;render()}
 else if(el.dataset.del){S.rules.splice(+el.dataset.del,1);store.set('mc_rules',S.rules);render()}
 else if(el.dataset.res){const r=JSON.parse(el.dataset.res);S.loc=r;store.set('mc_loc',r);$('#results').classList.add('hide');$('#q').value='';S.sel=0;render();load()}
 else if(el.id==='btnSearch')doSearch();
 else if(el.id==='btnRefresh'){load()}
 else if(el.id==='calRun'){calibrate(true).then(()=>rebuild())}
 else if(el.id==='btnGeo'){if(!window.isSecureContext){alert(t('geoHttps'));return}navigator.geolocation?.getCurrentPosition(p=>{S.loc={name:`${p.coords.latitude.toFixed(3)}, ${p.coords.longitude.toFixed(3)}`,lat:p.coords.latitude,lon:p.coords.longitude};store.set('mc_loc',S.loc);S.sel=0;render();load()},err=>alert(err.message))}
 else if(el.id==='applyModels'){document.querySelectorAll('[data-mon]').forEach(c=>{const id=c.dataset.mon,w=+document.querySelector(`[data-mw="${id}"]`).value;S.mcfg[id]={on:c.checked,w:isNaN(w)?1:w}});store.set('mc_models',S.mcfg);S.tab='forecast';render();load()}
 else if(el.id==='resetModels'){S.mcfg={};store.set('mc_models',{});render()}
 else if(el.id==='addRule'){const thr=+$('#rThr').value,minP=+$('#rP').value;if(isNaN(thr)||isNaN(minP))return;S.rules.push({id:Date.now().toString(36),v:$('#rV').value,op:$('#rOp').value,thr,minP,name:$('#rN').value.trim()});store.set('mc_rules',S.rules);render();notifyIfNeeded()}
 else if(el.id==='notifBtn'){await Notification.requestPermission();render();notifyIfNeeded()}
});
async function doSearch(){
 const q=$('#q').value.trim();if(!q)return;const box=$('#results');
 try{const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=${S.lang}&format=json`);
  const r=j.results||[];box.classList.remove('hide');
  box.innerHTML=r.length?r.map(x=>{const o={name:x.name,admin:x.admin1||'',country:x.country_code||'',lat:x.latitude,lon:x.longitude};return`<div data-res='${esc(JSON.stringify(o))}'>${esc([x.name,x.admin1,x.country].filter(Boolean).join(', '))}</div>`}).join(''):`<div>${t('noResults')}</div>`;
 }catch(e){box.classList.remove('hide');box.innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
document.addEventListener('change',e=>{
 const id=e.target.id;if(!['calMethod','calTruth','calDays'].includes(id))return;
 if(id==='calMethod'){S.method=e.target.value;store.set('mc_method',S.method);if(S.method!=='prior'&&!S.cal){calibrate(false).then(()=>rebuild())}else rebuild();return}
 if(id==='calTruth'){S.calTruth=e.target.value;store.set('mc_truth',S.calTruth)}
 if(id==='calDays'){S.calDays=+e.target.value;store.set('mc_caldays',S.calDays)}
 S.cal=store.get(calKey(),null);rebuild();if(!S.cal&&S.method!=='prior')calibrate(false).then(()=>rebuild());
});
$('#lang').addEventListener('change',e=>{S.lang=e.target.value;store.set('mc_lang',S.lang);render()});
$('#days').addEventListener('change',e=>{S.days=+e.target.value;store.set('mc_days',S.days);S.sel=0;load()});
$('#lang').value=S.lang;
render();load();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.updated&&Date.now()-S.updated>30*60*1000)load()});
if('serviceWorker' in navigator&&window.isSecureContext){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
